services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: todo-web:latest
    container_name: todo-web
    restart: unless-stopped
    build:
      # context 必须是 repo 根，Dockerfile.prod 里所有路径都是相对的（没 ../）
      context: ..
      dockerfile: apps/web/Dockerfile.prod
    command: ["/bin/sh", "-c", "node apps/web/server.js 2>&1 | tee -a /var/log/todo-web/app.log"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: true
      DOMAIN: ${DOMAIN}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      # ---------- 游客模式（可选，不配则登录页不显示「游客体验」）----------
      # environment 是白名单：.env 里加了变量但这里没列，容器就拿不到
      GUEST_PHONE: ${GUEST_PHONE:-}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-}
    volumes:
      - todo-logs:/var/log/todo-web
      - uploads:/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: todo-caddy
    restart: unless-stopped
    # 2026-10-20：备案下来后要申请 Let's Encrypt cert，caddy 容器内的 Docker DNS
    # (127.0.0.11) 解析 acme-v02.api.letsencrypt.org 失败，必须指定阿里 + 谷歌 DNS
    dns:
      - 223.5.5.5
      - 8.8.8.8
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 同一个 uploads volume 挂到 caddy 的 /uploads，Caddyfile 用 file_server root /uploads
      - uploads:/uploads:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  todo-logs:
  caddy_data:
  caddy_config:
  uploads:
