# =====================================================
# PostgreSQL 16 - 2GiB ECS 调优配置
# =====================================================

# 监听
listen_addresses = '*'
port = 5432

# 资源（关键：限制 PG 不超 350MB）
shared_buffers = 256MB              # 总内存 1/8（2GB → 256MB）
effective_cache_size = 1GB          # OS 文件缓存估计
work_mem = 4MB                       # 每个查询排序/哈希
maintenance_work_mem = 128MB        # VACUUM/INDEX 等
wal_buffers = 8MB                    # WAL 缓冲

# 连接（100 用户足够）
max_connections = 50
superuser_reserved_connections = 3

# 日志（减少磁盘 IO）
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # 只记录 >1s 的慢查询
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = on

# 性能调优
random_page_cost = 1.1               # SSD 默认
effective_io_concurrency = 200       # SSD
max_worker_processes = 2             # 2 vCPU
max_parallel_workers_per_gather = 1
max_parallel_workers = 2

# 自动清理（autovacuum）
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# 客户端
client_min_messages = warning
timezone = 'Asia/Shanghai'

# SSL（Next.js 在内网连接，关闭）
ssl = off